<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Desk — Chat</title><style>:root{font-family:system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:860px;margin:auto;padding:24px 16px;min-height:100vh;display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:1.45rem;margin:0}a{color:#356ae6;text-decoration:none}.settings{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.settings label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600}select,input,button{font:inherit;border:1px solid #ccd5e3;border-radius:9px;padding:9px;background:#fff}input{min-width:220px}.messages{flex:1;background:#fff;border:1px solid #e0e6ef;border-radius:14px;padding:16px;min-height:420px;overflow:auto}.bubble{max-width:80%;padding:11px 14px;border-radius:14px;margin:9px 0;white-space:pre-wrap;line-height:1.55}.user{background:#356ae6;color:#fff;margin-left:auto}.assistant{background:#edf1f7}.composer{display:flex;gap:9px;margin-top:14px}.composer input{flex:1}.composer button{background:#356ae6;color:#fff;border:0;font-weight:700}button:disabled{opacity:.55}</style></head><body><main class="shell"><header><h1>💬 AI Desk Chat</h1><a href="/">กลับหน้าแรก</a></header><section class="settings"><label>Provider<select id="provider"><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></label><label>Model<input id="model" placeholder="ใช้ค่าเริ่มต้นจาก server"></label></section><section id="messages" class="messages" aria-live="polite"></section><form id="form" class="composer"><input id="input" autocomplete="off" placeholder="พิมพ์ข้อความ..." required><button id="send">ส่ง</button></form></main><script src="/chat/app.js"></script></body></html>
